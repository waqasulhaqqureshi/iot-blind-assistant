<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" width="1600" height="720" role="img" aria-label="Decision flow of the object announcer">
  <rect width="1600" height="720" fill="#ffffff"/>
  <defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1a1a1a"/></marker>
  <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0072B2"/></marker>
</defs>
  <text x="40" y="56" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#1a1a1a"><tspan x="40" dy="0">Fig. 5  </tspan></text><text x="177.76" y="56" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#1a1a1a"><tspan x="177.76" dy="0">How the announcer decides what to say (objects in the live camera view)</tspan></text><rect x="40" y="250" width="190" height="110" rx="9" fill="#E3F4EC" stroke="#009E73" stroke-width="2"/><text x="135" y="298.8" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#1a1a1a"><tspan x="135" dy="0">Detections</tspan></text><text x="135" y="326.55" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#555555"><tspan x="135" dy="0">label, score, box</tspan></text><polygon points="270,305 375,230 480,305 375,380" fill="#fff" stroke="#1a1a1a" stroke-width="2.2"/><text x="375" y="301" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#1a1a1a"><tspan x="375" dy="0">score at least</tspan><tspan x="375" dy="19.549999999999997">threshold (0.6)?</tspan></text><rect x="520" y="250" width="190" height="110" rx="9" fill="#E3F4EC" stroke="#009E73" stroke-width="2"/><text x="615" y="298.8" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#1a1a1a"><tspan x="615" dy="0">Merge duplicates</tspan></text><text x="615" y="326.55" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#555555"><tspan x="615" dy="0">same label counts once</tspan></text><polygon points="750,305 855,230 960,305 855,380" fill="#fff" stroke="#1a1a1a" stroke-width="2.2"/><text x="855" y="301" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#1a1a1a"><tspan x="855" dy="0">said in the</tspan><tspan x="855" dy="19.549999999999997">last 30 s?</tspan></text><rect x="1000" y="250" width="170" height="110" rx="9" fill="#E3F4EC" stroke="#009E73" stroke-width="2"/><text x="1085" y="298.8" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#1a1a1a"><tspan x="1085" dy="0">Keep top 3</tspan></text><text x="1085" y="326.55" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#555555"><tspan x="1085" dy="0">by score</tspan></text><rect x="1210" y="250" width="170" height="110" rx="9" fill="#E3F4EC" stroke="#009E73" stroke-width="2"/><text x="1295" y="298.8" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#1a1a1a"><tspan x="1295" dy="0">Add position</tspan></text><text x="1295" y="326.55" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#555555"><tspan x="1295" dy="0">left / ahead / right</tspan></text><rect x="1420" y="250" width="150" height="110" rx="9" fill="#FCEFD2" stroke="#E69F00" stroke-width="2"/><text x="1495" y="290.675" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#1a1a1a"><tspan x="1495" dy="0">Speak</tspan></text><text x="1495" y="318.425" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#555555"><tspan x="1495" dy="0">“I see a person</tspan><tspan x="1495" dy="17.5">on your left.”</tspan></text><path d="M230 305 H270" fill="none" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#ah)" stroke-linejoin="round"/><path d="M480 305 H520" fill="none" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#ah)" stroke-linejoin="round"/><path d="M710 305 H750" fill="none" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#ah)" stroke-linejoin="round"/><path d="M960 305 H1000" fill="none" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#ah)" stroke-linejoin="round"/><path d="M1170 305 H1210" fill="none" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#ah)" stroke-linejoin="round"/><path d="M1380 305 H1420" fill="none" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#ah)" stroke-linejoin="round"/><text x="495" y="290" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#1a1a1a"><tspan x="495" dy="0">yes</tspan></text><text x="975" y="290" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#1a1a1a"><tspan x="975" dy="0">no</tspan></text><path d="M375 395 V470" fill="none" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#ah)" stroke-linejoin="round"/><text x="390" y="440" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#1a1a1a"><tspan x="390" dy="0">no</tspan></text><rect x="300" y="470" width="150" height="60" rx="9" fill="#fff" stroke="#555555" stroke-width="2"/><text x="375" y="494.1" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a"><tspan x="375" dy="0">drop</tspan></text><text x="375" y="520.6" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#555555"><tspan x="375" dy="0">weak guess</tspan></text><path d="M855 395 V470" fill="none" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#ah)" stroke-linejoin="round"/><text x="870" y="440" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#1a1a1a"><tspan x="870" dy="0">yes</tspan></text><rect x="780" y="470" width="150" height="60" rx="9" fill="#fff" stroke="#555555" stroke-width="2"/><text x="855" y="494.1" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a"><tspan x="855" dy="0">stay silent</tspan></text><text x="855" y="520.6" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#555555"><tspan x="855" dy="0">no repeat</tspan></text><text x="40" y="620" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#1a1a1a"><tspan x="40" dy="0">After speaking, the time of each announced label is stored, so the same label stays quiet until the cooldown ends.</tspan></text><text x="40" y="652" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#1a1a1a"><tspan x="40" dy="0">Distance-sensor warnings do not pass through this flow: “Stop” interrupts any speech in progress.</tspan></text><text x="40" y="684" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#1a1a1a"><tspan x="40" dy="0">The “Read text” button also bypasses it and always speaks, after the OCR filter has removed low-confidence words.</tspan></text>
</svg>
