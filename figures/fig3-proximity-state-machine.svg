<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 890" width="1600" height="890" role="img" aria-label="State machine of the proximity zones">
  <rect width="1600" height="890" fill="#ffffff"/>
  <defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1a1a1a"/></marker>
  <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0072B2"/></marker>
</defs>
  <text x="40" y="56" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#1a1a1a"><tspan x="40" dy="0">Fig. 3  </tspan></text><text x="177.76" y="56" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#1a1a1a"><tspan x="177.76" dy="0">Proximity zones as a state machine, with hysteresis</tspan></text><circle cx="350" cy="380" r="95" fill="#E3F4EC" stroke="#009E73" stroke-width="4"/><text x="350" y="390" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a"><tspan x="350" dy="0">Clear</tspan></text><circle cx="800" cy="380" r="95" fill="#FCEFD2" stroke="#E69F00" stroke-width="4"/><text x="800" y="390" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a"><tspan x="800" dy="0">Warn</tspan></text><circle cx="1250" cy="380" r="95" fill="#F7D9C7" stroke="#D55E00" stroke-width="4"/><text x="1250" y="390" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a"><tspan x="1250" dy="0">Danger</tspan></text><path d="M445 345 H705" fill="none" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#ah)" stroke-linejoin="round"/><text x="575" y="318" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#1a1a1a"><tspan x="575" dy="0">distance under 120 cm</tspan></text><text x="575" y="337" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#555555"><tspan x="575" dy="0">say: Obstacle ahead, about N</tspan></text><path d="M705 415 H445" fill="none" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#ah)" stroke-linejoin="round"/><text x="575" y="442" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#1a1a1a"><tspan x="575" dy="0">distance 135 cm or more</tspan></text><text x="575" y="461" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#555555"><tspan x="575" dy="0">say: Path clear.</tspan></text><path d="M895 345 H1155" fill="none" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#ah)" stroke-linejoin="round"/><text x="1025" y="318" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#1a1a1a"><tspan x="1025" dy="0">distance under 50 cm</tspan></text><text x="1025" y="337" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#555555"><tspan x="1025" dy="0">say: Stop. Obstacle very close.</tspan></text><path d="M1155 415 H895" fill="none" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#ah)" stroke-linejoin="round"/><text x="1025" y="442" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#1a1a1a"><tspan x="1025" dy="0">65 to 120 cm</tspan></text><text x="1025" y="461" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#555555"><tspan x="1025" dy="0">say: Obstacle ahead, about N</tspan></text><path d="M350 285 C350 100 1250 100 1250 285" fill="none" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#ah)" stroke-linejoin="round"/><text x="800" y="108" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#1a1a1a"><tspan x="800" dy="0">distance under 50 cm (skips the warning)</tspan></text><text x="800" y="128" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#555555"><tspan x="800" dy="0">say: Stop. Obstacle very close.</tspan></text><path d="M1250 475 C1250 640 350 640 350 475" fill="none" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#ah)" stroke-linejoin="round"/><text x="800" y="640" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#1a1a1a"><tspan x="800" dy="0">distance 120 cm or more</tspan></text><text x="800" y="660" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#555555"><tspan x="800" dy="0">say: Path clear.</tspan></text><rect x="40" y="710" width="1520" height="150" rx="10" fill="#fafafa" stroke="#d9d9d9" stroke-width="1.5"/><text x="60" y="744" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#1a1a1a"><tspan x="60" dy="0">Rules (all covered by unit tests)</tspan></text><text x="60" y="774" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#1a1a1a"><tspan x="60" dy="0">•  Moving to a more severe zone speaks at once. Moving to a less severe zone needs a margin (15 cm), so a reading that jitters around 50 or 120 cm stays quiet.</tspan></text><text x="60" y="802" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#1a1a1a"><tspan x="60" dy="0">•  Inside Danger the warning repeats every 3 s. Inside Warn it repeats only if the obstacle is at least 20 cm closer and 3 s have passed.</tspan></text><text x="60" y="830" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#1a1a1a"><tspan x="60" dy="0">•  A reading under 2 cm or over 400 cm means the sensor sees nothing and counts as far away (Clear). Unreadable packets are ignored.</tspan></text>
</svg>
