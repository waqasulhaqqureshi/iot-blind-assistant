<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 840" width="1600" height="840" role="img" aria-label="Wiring diagram for the ESP32 and the HC-SR04 sensor">
  <rect width="1600" height="840" fill="#ffffff"/>
  <defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1a1a1a"/></marker>
  <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0072B2"/></marker>
</defs>
  <text x="40" y="56" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#1a1a1a"><tspan x="40" dy="0">Fig. 4  </tspan></text><text x="177.76" y="56" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#1a1a1a"><tspan x="177.76" dy="0">Wiring: ESP32 and HC-SR04 with a voltage divider on the echo line</tspan></text><rect x="80" y="130" width="360" height="540" rx="9" fill="#E3F2FB" stroke="#0072B2" stroke-width="2"/><text x="260" y="175" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#1a1a1a"><tspan x="260" dy="0">ESP32 DevKit</tspan></text><rect x="1160" y="130" width="360" height="540" rx="9" fill="#E3F2FB" stroke="#0072B2" stroke-width="2"/><text x="1340" y="175" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#1a1a1a"><tspan x="1340" dy="0">HC-SR04 sensor</tspan></text><circle cx="440" cy="240" r="9" fill="#c00000"/><circle cx="1160" cy="240" r="9" fill="#c00000"/><text x="425" y="247" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="end" fill="#1a1a1a"><tspan x="425" dy="0">5V (VIN)</tspan></text><text x="1175" y="247" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#1a1a1a"><tspan x="1175" dy="0">VCC</tspan></text><line x1="449" y1="240" x2="1151" y2="240" stroke="#c00000" stroke-width="5"/><text x="800" y="226" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#555555"><tspan x="800" dy="0">5 V power</tspan></text><circle cx="440" cy="330" r="9" fill="#000000"/><circle cx="1160" cy="330" r="9" fill="#000000"/><text x="425" y="337" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="end" fill="#1a1a1a"><tspan x="425" dy="0">GND</tspan></text><text x="1175" y="337" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#1a1a1a"><tspan x="1175" dy="0">GND</tspan></text><line x1="449" y1="330" x2="1151" y2="330" stroke="#000000" stroke-width="5"/><text x="800" y="316" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#555555"><tspan x="800" dy="0">ground</tspan></text><circle cx="440" cy="430" r="9" fill="#009E73"/><circle cx="1160" cy="430" r="9" fill="#009E73"/><text x="425" y="437" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="end" fill="#1a1a1a"><tspan x="425" dy="0">GPIO 5</tspan></text><text x="1175" y="437" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#1a1a1a"><tspan x="1175" dy="0">TRIG</tspan></text><line x1="449" y1="430" x2="1151" y2="430" stroke="#009E73" stroke-width="5"/><text x="800" y="416" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#555555"><tspan x="800" dy="0">trigger pulse</tspan></text><circle cx="440" cy="530" r="9" fill="#0072B2"/><circle cx="1160" cy="530" r="9" fill="#0072B2"/><text x="425" y="537" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="end" fill="#1a1a1a"><tspan x="425" dy="0">GPIO 18</tspan></text><text x="1175" y="537" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#1a1a1a"><tspan x="1175" dy="0">ECHO</tspan></text><line x1="1151" y1="530" x2="910" y2="530" stroke="#0072B2" stroke-width="5"/><rect x="790" y="512" width="120" height="36" rx="4" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="850" y="538" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#1a1a1a"><tspan x="850" dy="0">1 kΩ</tspan></text><line x1="790" y1="530" x2="620" y2="530" stroke="#0072B2" stroke-width="5"/><line x1="620" y1="530" x2="449" y2="530" stroke="#0072B2" stroke-width="5"/><circle cx="620" cy="530" r="8" fill="#1a1a1a"/><text x="620" y="500" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#1a1a1a"><tspan x="620" dy="0">node: about 3.3 V</tspan></text><line x1="620" y1="530" x2="620" y2="580" stroke="#0072B2" stroke-width="5"/><rect x="602" y="580" width="36" height="80" rx="4" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="660" y="628" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#1a1a1a"><tspan x="660" dy="0">2 kΩ</tspan></text><line x1="620" y1="660" x2="620" y2="690" stroke="#000" stroke-width="5"/><line x1="595" y1="690" x2="645" y2="690" stroke="#000" stroke-width="5"/><line x1="603" y1="702" x2="637" y2="702" stroke="#000" stroke-width="4"/><line x1="611" y1="714" x2="629" y2="714" stroke="#000" stroke-width="3"/><text x="40" y="780" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#1a1a1a"><tspan x="40" dy="0">ECHO outputs 5 V and the ESP32 input tolerates 3.3 V: 5 V × 2 kΩ / (1 kΩ + 2 kΩ) ≈ 3.3 V. Power the sensor from VIN (5 V).</tspan></text><text x="40" y="812" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#D55E00"><tspan x="40" dy="0">Reference wiring for the sketch in firmware/esp32-ultrasonic-ble. It has not been built or tested on hardware yet.</tspan></text>
</svg>
