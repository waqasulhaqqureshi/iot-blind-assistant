<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 940" width="1800" height="940" role="img" aria-label="Top view of the sensing zones around the wearer">
  <rect width="1800" height="940" fill="#ffffff"/>
  <defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1a1a1a"/></marker>
  <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0072B2"/></marker>
</defs>
  <text x="40" y="56" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#1a1a1a"><tspan x="40" dy="0">Fig. 2  </tspan></text><text x="177.76" y="56" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#1a1a1a"><tspan x="177.76" dy="0">Sensing zones around the wearer (top view, schematic)</tspan></text><path d="M220 800 A480 480 0 0 1 1180 800 Z" fill="#E3F4EC" stroke="#555555" stroke-width="1.5"/><path d="M412 800 A288 288 0 0 1 988 800 Z" fill="#FCEFD2" stroke="#555555" stroke-width="1.5"/><path d="M580 800 A120 120 0 0 1 820 800 Z" fill="#F7D9C7" stroke="#555555" stroke-width="1.5"/><line x1="700" y1="800" x2="424.6833105514979" y2="406.8070187412839" stroke="#0072B2" stroke-width="2" stroke-dasharray="9 6"/><line x1="700" y1="800" x2="602.662098228874" y2="329.9730509015524" stroke="#0072B2" stroke-width="2" stroke-dasharray="9 6"/><line x1="700" y1="800" x2="797.337901771126" y2="329.9730509015524" stroke="#0072B2" stroke-width="2" stroke-dasharray="9 6"/><line x1="700" y1="800" x2="975.3166894485021" y2="406.8070187412839" stroke="#0072B2" stroke-width="2" stroke-dasharray="9 6"/><text x="499.8539757031397" y="335.26613104039785" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#0072B2"><tspan x="499.8539757031397" dy="0">left</tspan></text><text x="700" y="294" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#0072B2"><tspan x="700" dy="0">ahead</tspan></text><text x="900.1460242968603" y="335.26613104039785" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#0072B2"><tspan x="900.1460242968603" dy="0">right</tspan></text><path d="M700 800 L648.3116278808595 407.3878348959711 L751.6883721191405 407.3878348959711 Z" fill="#56B4E9" fill-opacity="0.55" stroke="#0072B2" stroke-width="1.5"/><text x="813.9537111430712" y="737.6634124656931" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#555555"><tspan x="813.9537111430712" dy="0">50 cm</tspan></text><text x="962.288906743371" y="658.7921899176634" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#555555"><tspan x="962.288906743371" dy="0">120 cm</tspan></text><text x="1131.814844572285" y="568.6536498627725" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#555555"><tspan x="1131.814844572285" dy="0">200 cm</tspan></text><rect x="672" y="566" width="56" height="36" rx="6" fill="#888" stroke="#1a1a1a" stroke-width="2"/><text x="740" y="590" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#1a1a1a"><tspan x="740" dy="0">chair</tspan></text><circle cx="534.0514496250735" cy="413.27345328181883" r="12" fill="#888" stroke="#1a1a1a" stroke-width="2"/><ellipse cx="534.0514496250735" cy="441.27345328181883" rx="22" ry="12" fill="#888" stroke="#1a1a1a" stroke-width="2"/><text x="534.0514496250735" y="477.27345328181883" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#1a1a1a"><tspan x="534.0514496250735" dy="0">person</tspan></text><ellipse cx="700" cy="820" rx="52" ry="18" fill="#1a1a1a"/><circle cx="700" cy="806" r="18" fill="#1a1a1a"/><rect x="691" y="816" width="18" height="26" rx="3" fill="#fff" stroke="#1a1a1a" stroke-width="2"/><text x="700" y="868" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#555555"><tspan x="700" dy="0">wearer (phone on chest, sensor on belt or cane)</tspan></text><rect x="290" y="506" width="300" height="58" rx="10" fill="#fff" stroke="#D55E00" stroke-width="2"/><text x="440" y="532" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#1a1a1a"><tspan x="440" dy="0">“Obstacle ahead,</tspan><tspan x="440" dy="19.549999999999997">about 90 centimetres.”</tspan></text><path d="M590 535 L668 580" fill="none" stroke="#D55E00" stroke-width="2.2" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="100" y="150" width="280" height="56" rx="10" fill="#fff" stroke="#0072B2" stroke-width="2"/><text x="240" y="184" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#1a1a1a"><tspan x="240" dy="0">“I see a person on your left.”</tspan></text><path d="M380 190 L516.0514496250735 397.27345328181883" fill="none" stroke="#0072B2" stroke-width="2.2" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="1290" y="150" width="430" height="440" rx="12" fill="#fff" stroke="#555555" stroke-width="1.5"/><text x="1310" y="186" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#1a1a1a"><tspan x="1310" dy="0">Distance sensor (ultrasonic)</tspan></text><rect x="1310" y="206" width="30" height="22" fill="#F7D9C7" stroke="#555555"/><text x="1352" y="224" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#1a1a1a"><tspan x="1352" dy="0">Danger: under 50 cm</tspan></text><text x="1352" y="248" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#555555"><tspan x="1352" dy="0">“Stop. Obstacle very close.”</tspan><tspan x="1352" dy="19.2">strong vibration, repeats every 3 s</tspan></text><rect x="1310" y="300" width="30" height="22" fill="#FCEFD2" stroke="#555555"/><text x="1352" y="318" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#1a1a1a"><tspan x="1352" dy="0">Warning: 50 to 120 cm</tspan></text><text x="1352" y="342" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#555555"><tspan x="1352" dy="0">“Obstacle ahead, about N.”</tspan><tspan x="1352" dy="19.2">short vibration</tspan></text><rect x="1310" y="388" width="30" height="22" fill="#E3F4EC" stroke="#555555"/><text x="1352" y="406" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#1a1a1a"><tspan x="1352" dy="0">Clear: over 120 cm</tspan></text><text x="1352" y="430" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#555555"><tspan x="1352" dy="0">“Path clear.” once, on leaving a zone</tspan></text><text x="1310" y="480" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#1a1a1a"><tspan x="1310" dy="0">Hysteresis: danger ends at 65 cm,</tspan><tspan x="1310" dy="20">warning ends at 135 cm, so jitter</tspan><tspan x="1310" dy="20">around a threshold stays quiet.</tspan></text><line x1="1310" y1="550" x2="1340" y2="550" stroke="#0072B2" stroke-width="2" stroke-dasharray="9 6"/><text x="1352" y="556" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#1a1a1a"><tspan x="1352" dy="0">Camera: left / ahead / right</tspan></text><rect x="1310" y="564" width="30" height="14" fill="#56B4E9" fill-opacity="0.55" stroke="#0072B2"/><text x="1352" y="578" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#1a1a1a"><tspan x="1352" dy="0">Ultrasonic beam (narrow, about 15°)</tspan></text><text x="40" y="915" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#555555" font-style="italic"><tspan x="40" dy="0">Schematic, not measured data. Distances use 2.4 px per cm along the vertical axis; the camera sectors are drawn as equal angles for clarity.</tspan></text>
</svg>
